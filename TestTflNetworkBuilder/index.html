<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Component-Based Canvas Drawing</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
        }

        canvas {
            display: block;
            background-color: white;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        // Shared canvas component
        const Canvas = React.forwardRef((props, ref) => {
          return <canvas ref={ref} width={800} height={600}></canvas>;
        });

        // Line component
        const Line = ({ ctx, x1, y1, x2, y2 }) => {
          React.useEffect(() => {
            if (ctx) {
              ctx.strokeStyle = 'blue';
              ctx.lineWidth = 1;
              ctx.beginPath();
              ctx.moveTo(x1, y1);
              ctx.lineTo(x2, y2);
              ctx.stroke();
            }
          }, [ctx]);
          return null;
        };

        // Square component
        const Square = ({ ctx, x, y }) => {
          React.useEffect(() => {
            if (ctx) {
              ctx.fillStyle = 'black';
              ctx.fillRect(x, y, 5, 5);
            }
          }, [ctx]);
          return null;
        };

        // Text label component
        const TextLabel = ({ ctx, x, y, text }) => {
          React.useEffect(() => {
            if (ctx) {
              ctx.font = '12pt sans-serif';
              ctx.fillStyle = 'black';
              ctx.fillText(text, x, y);
            }
          }, [ctx]);
          return null;
        };

        const App = () => {
          const canvasRef = React.useRef(null);
          const [ctx, setCtx] = React.useState(null);

          React.useEffect(() => {
            const canvas = canvasRef.current;
            if (canvas) {
              setCtx(canvas.getContext('2d'));
            }
          }, []);

          return (
            <>
              <Canvas ref={canvasRef} />
              <Line ctx={ctx} x1={50} y1={20} x2={200} y2={200} />
              <Square ctx={ctx} x={100} y={50} />
              <TextLabel ctx={ctx} x={120} y={80} text="Hello, world!" />
              <Line ctx={ctx} x1={30} y1={100} x2={300} y2={100} />
              <Square ctx={ctx} x={150} y={120} />
              <TextLabel ctx={ctx} x={180} y={150} text="Edit me!" />
            </>
          );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
